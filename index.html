<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MV Car Detail · Book your detail</title>
<meta name="description" content="Professional mobile detailing and shop in Hollywood, FL. Serving Miami-Dade, Broward and Charlotte. Pick your service and book in seconds.">
<meta name="theme-color" content="#070809">
<meta property="og:title" content="MV Car Detail · Book your detail">
<meta property="og:image" content="/video/hero-poster.jpg">
<link rel="icon" href="/img/logo.webp">
<link rel="apple-touch-icon" href="/img/logo.webp">
<link rel="preload" href="/fonts/general-sans-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/satoshi-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/style.css">
<style>
  /* Background video, fixed behind everything */
  .bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #000 url('/video/hero-poster.jpg') center / cover; }
  .bg video { width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 60% at 50% 0%, rgba(7,8,9,.2), rgba(7,8,9,.85) 70%), linear-gradient(180deg, rgba(7,8,9,.35), rgba(7,8,9,.92) 55%); }
  body { background: transparent; }

  .top { display: flex; align-items: center; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top)) 0 0; }
  .top .logo img { height: 52px; width: auto; border-radius: 12px; box-shadow: 0 0 0 1px rgba(46,230,214,.35), 0 0 28px rgba(46,230,214,.25); }

  .intro { padding: clamp(28px, 6vh, 64px) 0 22px; max-width: 760px; }
  .intro h1 { font-size: clamp(40px, 9vw, 84px); margin: 0; }
  .intro .bar { width: 44px; height: 3px; border-radius: 3px; background: var(--accent); margin: 18px 0 14px; }
  .intro p { margin: 0; font-family: var(--display); font-weight: 500; text-transform: uppercase; letter-spacing: .02em; font-size: clamp(14px, 2.2vw, 18px); color: #e3e7ea; }
  .intro p b { color: var(--accent); font-weight: 600; }
  .rating { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; padding: 7px 14px; border-radius: 999px; background: rgba(16,18,21,.7); border: 1px solid var(--line); font-size: 14px; text-decoration: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .rating .stars { color: var(--offer); letter-spacing: 2px; }

  /* Service cards */
  .cards { display: grid; gap: 10px; padding-bottom: 14px; }
  @media (min-width: 900px) { .cards { grid-template-columns: 1fr 1fr; } .cards .contact { grid-column: 1 / -1; } }
  .svc { position: relative; display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; min-height: 118px; padding: 16px 18px; border-radius: 18px; overflow: hidden; text-decoration: none;
    background: linear-gradient(90deg, rgba(10,12,14,.96) 45%, rgba(10,12,14,.55) 70%, rgba(10,12,14,.15)), var(--img, none) right center / 58% auto no-repeat, #0b0d0f;
    border: 1px solid rgba(46,230,214,.35); box-shadow: inset 0 0 0 1px rgba(255,255,255,.03), 0 0 22px -8px rgba(46,230,214,.45);
    opacity: 0; transform: translateY(14px); animation: cardIn .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: calc(.15s + var(--i) * .07s); }
  @keyframes cardIn { to { opacity: 1; transform: none; } }
  .svc:hover { border-color: var(--accent); }
  .svc .ico { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--accent); color: var(--accent); box-shadow: 0 0 16px -4px rgba(46,230,214,.6); }
  .svc .ico svg { width: 28px; height: 28px; }
  .svc h2 { margin: 0; font-family: var(--display); font-weight: 600; text-transform: uppercase; font-size: 20px; line-height: 1.1; color: #fff; }
  .svc .meta { margin: 4px 0 10px; font-size: 14px; color: var(--accent); }
  .svc .meta s { color: var(--muted); margin-right: 4px; }
  .svc .go { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border: 1.5px solid var(--accent); border-radius: 8px; font-family: var(--display); font-weight: 600; text-transform: uppercase; font-size: 14px; color: var(--accent); transition: background .2s, color .2s; }
  .svc:hover .go, .svc:focus-visible .go { background: var(--accent); color: var(--accent-ink); }
  .svc .go svg { width: 16px; height: 16px; }
  .svc .tag { position: absolute; bottom: 12px; right: 12px; font: 700 10px/1 var(--body); letter-spacing: .1em; text-transform: uppercase; padding: 5px 9px; border-radius: 99px; background: var(--offer); color: #241600; }
  .svc .tag.pop { background: var(--accent); color: var(--accent-ink); }

  .contact { background: linear-gradient(90deg, rgba(10,12,14,.96) 50%, rgba(10,12,14,.6)), url('/img/setmore-1.webp') right 40% / 60% auto no-repeat, #0b0d0f; }
  .contact .links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .contact .links a { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: rgba(16,18,21,.8); font-size: 13px; text-decoration: none; }
  .contact .links a svg { width: 15px; height: 15px; color: var(--accent); }
  .contact .addr { font-size: 13px; color: var(--muted); margin: 4px 0 0; }

  .badges { display: grid; grid-template-columns: repeat(4, 1fr); margin: 4px 0 18px; border: 1px solid var(--line); border-radius: 16px; background: rgba(10,12,14,.85); }
  .badges div { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; text-align: center; font: 600 11px/1.25 var(--display); text-transform: uppercase; letter-spacing: .02em; }
  .badges div + div { border-left: 1px solid var(--line); }
  .badges svg { width: 26px; height: 26px; color: var(--accent); }
  .badges span { color: var(--accent); display: block; }

  .map { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); height: 240px; margin-bottom: 14px; background: var(--surface); }
  .map iframe { width: 100%; height: 100%; border: 0; filter: invert(.92) hue-rotate(180deg) saturate(.6); }
  .foot { display: flex; flex-wrap: wrap; gap: 8px 18px; justify-content: center; padding: 6px 0 calc(90px + env(safe-area-inset-bottom)); font-size: 13px; color: var(--muted); }
  .foot a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .svc { opacity: 1; transform: none; animation: none; } }
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <video id="bgv" muted loop playsinline preload="metadata" poster="/video/hero-poster.jpg"><source src="/video/hero.mp4" type="video/mp4"></video>
</div>

<main class="wrap">
  <header class="top">
    <a class="logo" href="/" aria-label="MV Car Detail"><img src="/img/logo.webp" alt="MV Professional Car Detail and Supplies" width="52" height="52"></a>
    <a class="btn primary small" href="/booking">Book now</a>
  </header>

  <section class="intro" style="padding-inline:0">
    <h1 class="display">More than a wash.<br><em>Real detailing.</em></h1>
    <div class="bar"></div>
    <p>Mobile detailing & shop in <b>Hollywood, FL</b>.<br>Miami-Dade · Broward · Charlotte</p>
    <a class="rating" id="rating" href="https://maps.app.goo.gl/iEH7dF7M1SHxewJR6" target="_blank" rel="noopener"><span class="stars">★★★★★</span><b id="r-val">4.9</b><span class="muted" id="r-count">46 Google reviews</span></a>
  </section>

  <section class="cards" id="cards" style="padding:0 0 14px" aria-label="Services"></section>

  <div class="badges">
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5"/></svg>Mobile<span>& shop</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9m-6 0a6 6 0 1 0 12 0a6 6 0 1 0 -12 0M12 15l3.4 5.89l1.6 -3.23l3.6 .23l-3.4 -5.89M6.8 12l-3.4 5.89l3.6 -.23l1.6 3.23l3.4 -5.89"/></svg>Meguiar's<span>certified</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.46 20.85a12 12 0 0 1 -7.96 -14.85a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06M15 19l2 2l4 -4"/></svg>Price<span>upfront</span></div>
    <div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0M17.66 16.66l-4.25 4.24a2 2 0 0 1 -2.82 0l-4.25 -4.24a8 8 0 1 1 11.32 0z"/></svg>Since<span>2018</span></div>
  </div>

  <div class="map"><iframe title="MV Car Detail on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=MV+CAR+DETAIL,+3937+Pembroke+Rd,+Hollywood,+FL+33021&output=embed"></iframe></div>

  <nav class="foot"><a href="/moreinfo">More info</a><a href="/moreinfo#faq">FAQ</a><a href="/terms">Terms</a><a href="https://link.me/mvcardetail" target="_blank" rel="noopener">link.me/mvcardetail</a></nav>
</main>

<a class="fab-wa wa-link" href="#" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><span data-icon="wa"></span></a>

<script type="module">
import { loadContent, money, dur, wa, esc, icons, shineText, offerFor } from '/assets/common.js';

// Background video: skip for reduced motion / data saver, otherwise play muted inline (iOS + Android)
const v = document.getElementById('bgv');
const lite = matchMedia('(prefers-reduced-motion: reduce)').matches || navigator.connection?.saveData;
if (!lite) { v.preload = 'auto'; v.play().catch(() => {}); }

document.querySelectorAll('.wa-link').forEach(a => a.href = wa('Hi MV Car Detail! I would like to book a detail.'));
icons();
shineText();

// Icons per service level (Tabler-style outline paths)
const P = {
  1: 'M7.5 19.42c2.6 2.1 6.4 2.1 9 0c2.6 -2.1 3.26 -5.7 1.56 -8.54l-4.89 -7.26a1.38 1.38 0 0 0 -2.35 0l-4.89 7.26c-1.7 2.84 -1.04 6.44 1.57 8.54z',
  2: 'M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2zm-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6z',
  3: 'M5 11a2 2 0 0 1 2 2v2h10v-2a2 2 0 1 1 4 0v4a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-4a2 2 0 0 1 2 -2zM5 11v-5a3 3 0 0 1 3 -3h8a3 3 0 0 1 3 3v5M6 19v2M18 19v2',
  4: 'M7 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M17 17m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0M5 17h-2v-6l2 -5h9l4 5h1a2 2 0 0 1 2 2v4h-2m-4 0h-6m-6 -6h15m-6 0v-5',
  5: 'M6 5h12l3 5l-8.5 9.5a.7 .7 0 0 1 -1 0l-8.5 -9.5l3 -5M10 12l-2 -2.2l.6 -1',
};
const svg = d => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const arrow = svg('M5 12h14M13 18l6 -6M13 6l6 6');
const phone = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5l-2.5 1.5a11 11 0 0 0 5 5l1.5 -2.5l5 2v4a2 2 0 0 1 -2 2a16 16 0 0 1 -15 -15a2 2 0 0 1 2 -2"/></svg>';

const { services, offer, google } = await loadContent();

if (google) {
  if (google.rating) document.getElementById('r-val').textContent = Number(google.rating).toFixed(1);
  if (google.count) document.getElementById('r-count').textContent = `${google.count} Google reviews`;
  if (google.url) document.getElementById('rating').href = google.url;
}
const mapsUrl = google?.url || 'https://maps.app.goo.gl/iEH7dF7M1SHxewJR6';
const address = google?.address || '3937 Pembroke Rd, Hollywood, FL 33021';
const linkme = google?.linkme || 'https://link.me/mvcardetail';

document.getElementById('cards').innerHTML = services.map((s, i) => {
  const o = offerFor(offer, s.slug);
  return `<a class="svc" href="/booking?service=${s.slug}${o ? '&offer=1' : ''}" style="--i:${i};--img:url('${esc(s.image_url || '')}')">
    ${o ? '<span class="tag">First visit offer</span>' : s.popular ? '<span class="tag pop">Most popular</span>' : ''}
    <span class="ico">${svg(P[s.level] || P[4])}</span>
    <span>
      <h2>${esc(s.name)}</h2>
      <p class="meta">${o ? `<s>${money(s.price)}</s>` : 'from '}${money(o ? o.price : s.price)} · ${dur(s.duration_min)}</p>
      <span class="go">Book now ${arrow}</span>
    </span>
  </a>`;
}).join('') + `
  <div class="svc contact" style="--i:${services.length}">
    <span class="ico">${phone}</span>
    <span>
      <h2>Contact us</h2>
      <p class="addr">${esc(address)}</p>
      <span class="links">
        <a href="tel:+17865686564">${phone}English · 786 568 6564</a>
        <a href="tel:+19542687993">${phone}Español · 954 268 7993</a>
        <a class="wa-link" href="${wa('Hi MV Car Detail! I have a question.')}" target="_blank" rel="noopener"><span data-icon="wa"></span>WhatsApp</a>
        <a href="mailto:mvcardetail01@gmail.com"><span data-icon="mail"></span>Email</a>
        <a href="${esc(mapsUrl)}" target="_blank" rel="noopener">${svg('M9 11a3 3 0 1 0 6 0a3 3 0 0 0 -6 0M17.66 16.66l-4.25 4.24a2 2 0 0 1 -2.82 0l-4.25 -4.24a8 8 0 1 1 11.32 0z')}Directions</a>
        <a href="${esc(linkme)}" target="_blank" rel="noopener">${svg('M9 15l6 -6M11 6l.46 -.54a5 5 0 0 1 7.07 7.07l-.53 .47M13 18l-.4 .53a5.07 5.07 0 0 1 -7.12 0a4.97 4.97 0 0 1 0 -7.07l.52 -.46')}link.me</a>
      </span>
    </span>
  </div>`;
icons(document.getElementById('cards'));
</script>
</body>
</html>
